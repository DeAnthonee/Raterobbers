<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rate Robbers</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15151c;
        --panel: #22222c;
        --text: #f1f1f4;
        --muted: #9a9aa6;
        --accent: #ffd166;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        margin: 0 auto;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.55);
        overflow: auto;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay.hidden {
        display: none;
      }
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 24px;
        width: min(420px, 100%);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .panel.wide {
        width: min(760px, 100%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 12px 0;
        font-size: 14px;
        color: var(--muted);
      }
      input {
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3a3a48;
        background: #15151c;
        color: var(--text);
        text-transform: none;
      }
      #code {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        flex: 1;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #3a3a48;
        background: #2d2d3a;
        color: var(--text);
        cursor: pointer;
      }
      button:hover {
        background: #38384a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        color: #1a1400;
        border-color: var(--accent);
        font-weight: 600;
      }
      button.ghost {
        background: transparent;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 12px 0;
      }
      .row > button.primary {
        flex: 1;
      }
      .lobby-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .code {
        font-family: ui-monospace, monospace;
        letter-spacing: 0.2em;
        color: var(--accent);
        background: #15151c;
        padding: 2px 10px;
        border-radius: 6px;
      }
      .teams {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin: 12px 0;
      }
      .team {
        border: 2px solid;
        border-radius: 10px;
        padding: 10px;
        background: #1b1b24;
      }
      .team-head {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
      }
      .team ul {
        list-style: none;
        padding: 0;
        margin: 8px 0;
        min-height: 48px;
      }
      .team li.me {
        font-weight: 600;
      }
      .team button {
        width: 100%;
      }
      .tag {
        font-size: 11px;
        color: var(--accent);
      }
      .ok {
        font-size: 12px;
        color: #2ecc71;
      }
      details.config {
        margin: 8px 0;
      }
      details.config summary {
        cursor: pointer;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0 12px;
      }
      .grid label {
        margin: 6px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #33333f;
      }
      tr.winner td {
        font-weight: 700;
      }
      #touch {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        user-select: none;
        -webkit-user-select: none;
      }
      #touch.hidden {
        display: none;
      }
      #touch .dpad {
        position: absolute;
        left: 16px;
        bottom: 16px;
        width: 150px;
        height: 150px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
      }
      .touch-btn {
        pointer-events: auto;
        touch-action: none;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(40, 40, 52, 0.75);
        color: var(--text);
        font-size: 20px;
        font-weight: 700;
        padding: 0;
      }
      .touch-btn:active {
        background: rgba(255, 209, 102, 0.85);
        color: #1a1400;
      }
      .touch-btn.up {
        grid-column: 2;
        grid-row: 1;
      }
      .touch-btn.left {
        grid-column: 1;
        grid-row: 2;
      }
      .touch-btn.right {
        grid-column: 3;
        grid-row: 2;
      }
      .touch-btn.down {
        grid-column: 2;
        grid-row: 3;
      }
      .touch-btn.action {
        position: absolute;
        right: 16px;
        bottom: 24px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        font-size: 16px;
        letter-spacing: 0.05em;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        background: #2d2d3a;
        color: var(--text);
        padding: 10px 16px;
        border-radius: 8px;
        opacity: 0;
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
        z-index: 10;
      }
      #toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="overlay" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
